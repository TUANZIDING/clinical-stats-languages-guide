<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img"><rect width="1200" height="250" fill="#fafbf7"/><g font-family="Avenir Next,PingFang SC,Microsoft YaHei,sans-serif"><rect x="28" y="40" width="256" height="130" rx="7" fill="white" stroke="#d7e0da"/><text x="47" y="72" font-size="12" fill="#007965" >01</text><text x="47" y="111" font-size="25" fill="#123044" >提供设计</text><text x="47" y="145" font-size="13" fill="#536874" >人群 / 单位 / 结局 / 目标量</text><path d="M292,103h17m-5,-5l5,5l-5,5" fill="none" stroke="#007965"/><rect x="318" y="40" width="256" height="130" rx="7" fill="white" stroke="#d7e0da"/><text x="337" y="72" font-size="12" fill="#007965" >02</text><text x="337" y="111" font-size="25" fill="#123044" >AI 补缺口</text><text x="337" y="145" font-size="13" fill="#536874" >先问问题，再比候选</text><path d="M582,103h17m-5,-5l5,5l-5,5" fill="none" stroke="#007965"/><rect x="608" y="40" width="256" height="130" rx="7" fill="white" stroke="#d7e0da"/><text x="627" y="72" font-size="12" fill="#007965" >03</text><text x="627" y="111" font-size="25" fill="#123044" >模拟核查</text><text x="627" y="145" font-size="13" fill="#536874" >检查参数、来源与数值</text><path d="M872,103h17m-5,-5l5,5l-5,5" fill="none" stroke="#007965"/><rect x="898" y="40" width="256" height="130" rx="7" fill="white" stroke="#d7e0da"/><text x="917" y="72" font-size="12" fill="#007965" >04</text><text x="917" y="111" font-size="25" fill="#123044" >人工确认</text><text x="917" y="145" font-size="13" fill="#536874" >定稿方案并保留版本记录</text><text x="28" y="215" font-size="15" fill="#536874" >教学工作流；未验证 AI 决策准确性。外部 AI 使用前请核对隐私、机构要求和引用。</text></g></svg>