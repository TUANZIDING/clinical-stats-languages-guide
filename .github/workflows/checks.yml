name: Check teaching project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Install R and C++ math headers
        run: sudo apt-get update && sudo apt-get install -y r-base libboost-dev
      - name: Check method rules
        run: npm test
      - name: Check offline AI evaluation contracts and intentional failures (no model calls)
        run: npm run eval:offline
      - name: Check clinical reporting and R cross-check
        run: python tests/clinical-reportv2.0.py
      - name: Check published-paper aggregate snapshot against frozen targets
        run: python scripts/verify-paperv2.1.py
      - name: Check unified saved results and generated artifacts (offline snapshot only)
        run: python scripts/统一结果v2.2.py check
      - name: Check longitudinal saved replay and retained differences (no R model rerun)
        run: python scripts/纵向结果v2.2.py check
      - name: Check saved teaching report and course companion (no R calculation)
        run: |
          python scripts/计算报告v2.2.py check
          node scripts/教学文档v2.2.cjs --check
          python scripts/案例状态v2.2.py check
          python scripts/综合核查v2.2.py
      - name: Check versioned new filenames
        run: python scripts/check-filenamesv2.0.py
      - name: Check links and offline assets
        run: python scripts/check_project.py
      - name: Compile C++ teaching example
        run: |
          mkdir -p build
          g++ -std=c++17 examples/cpp/welch_demo.cpp -o build/综合Welchv2.2
      - name: Compare Python, R and C++ results
        run: python scripts/verify_results.py --r --cpp build/综合Welchv2.2
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/method-engine.js
          node --check docs/研究卡片v2.2.js
          node --check docs/教学课程v2.2.js
          node --check docs/教学交互v2.2.js
          node --check docs/案例状态交互v2.2.js
          node --check docs/assets/案例验证状态v2.2.js
          node --check docs/report-labv2.0.js
          node --check docs/assets/统一结果视图v2.2.js
          node --check docs/assets/纵向论文视图v2.2.js
          node --check docs/assets/clinical-resultsv2.0.js
          node --check docs/assets/paper-checkv2.1.js
          node --check scripts/AI测评引擎v2.3.cjs
          node --check scripts/AI离线测评v2.3.cjs
          node --check scripts/Promptfoo断言v2.3.cjs
          node --check scripts/Promptfoo结果核查v2.3.cjs
          node --check tests/AI测评测试v2.3.cjs
