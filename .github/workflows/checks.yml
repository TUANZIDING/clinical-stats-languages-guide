name: Check teaching project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Install R and C++ math headers
        run: sudo apt-get update && sudo apt-get install -y r-base libboost-dev
      - name: Check method rules
        run: npm test
      - name: Check links and offline assets
        run: python scripts/check_project.py
      - name: Compile C++ teaching example
        run: |
          mkdir -p build
          g++ -std=c++17 examples/cpp/welch_demo.cpp -o build/welch_demo
      - name: Compare Python, R and C++ results
        run: python scripts/verify_results.py --r --cpp build/welch_demo
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/method-engine.js
